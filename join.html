
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Us | Gaming Technology Hub</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>

    <header>
        <div class="topbar">
            <div class="logo">
                <span class="logo-mark">G</span>
                Tech Hub
            </div>

            <nav>
                <a href="/home/home.html">Home</a>
                <a href="/home/game.html">Games</a>
                <a href="/home/about.html">About</a>
                <a class="active"
                
            </nav>
        </div>
    </header>

    <main>
        <section class="page-heading">
            <h1>Join GTech Hub</h1>
            <p>
                Tell us a little about yourself and what you
                enjoy in gaming technology.
            </p>
        </section>

        <section class="form-box">
            <form id="joinForm">
                <label for="name">Your Name</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your name"
                    required
                >

                <label for="email">Email (optional)</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                >

                <label for="interest">Main Interest</label>
                <select id="interest" name="interest" required>
                    <option value="">Choose one</option>
                    <option>PC Gaming</option>
                    <option>Mobile Gaming</option>
                    <option>Consoles</option>
                    <option>Computer Hardware</option>
                    <option>Game Development</option>
                </select>

                <label for="message">Why do you want to join?</label>
                <textarea
                    id="message"
                    name="message"
                    placeholder="Write a short message..."
                    required
                ></textarea>

                <button type="submit">Submit</button>
            </form>

            <p id="joinMessage" class="notice" aria-live="polite"></p>
        </section>
    </main>

    <footer>© 2026 Gaming Technology Hub</footer>

    <script>
        document.getElementById("joinForm").addEventListener(
            "submit",
            function(event) {
                event.preventDefault();

                const member = {
                    name: document.getElementById("name").value.trim(),
                    email: document.getElementById("email").value.trim(),
                    interest: document.getElementById("interest").value,
                    message: document.getElementById("message").value.trim()
                };

                localStorage.setItem(
                    "gthJoinInfo",
                    JSON.stringify(member)
                );

                document.getElementById("joinMessage").textContent =
                    "Thanks for joining.";

                this.reset();
            }
        );
    </script>

</body>
</html>
